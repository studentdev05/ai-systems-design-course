<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI use-case screening flow</title>
  <desc id="desc">A decision flow checks outcome, whether deterministic software is enough, tolerable errors, human authority, and measurable usefulness before proceeding to a bounded AI experiment.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker><style>.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.q{fill:#e0f2fe;stroke:#0284c7;stroke-width:2.5}.stop{fill:#fee2e2;stroke:#dc2626;stroke-width:2.5}.go{fill:#dcfce7;stroke:#059669;stroke-width:3}.label{font:700 16px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#334155}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.edge{font:700 14px system-ui,sans-serif;fill:#475569}</style></defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Screen the use case before selecting the model</text>
  <rect x="350" y="85" width="500" height="78" rx="14" class="q"/>
  <text x="600" y="117" text-anchor="middle" class="label">Is the desired user or organizational outcome clear?</text>
  <text x="600" y="143" text-anchor="middle" class="small">Name the change, not “use AI”.</text>
  <path d="M600 163 V210" class="line"/><text x="615" y="195" class="edge">yes</text>
  <path d="M350 124 H285" class="line"/><text x="310" y="113" class="edge">no</text>
  <rect x="25" y="85" width="260" height="78" rx="14" class="stop"/>
  <text x="142" y="118" text-anchor="middle" class="label">Return to discovery</text><text x="142" y="143" text-anchor="middle" class="small">Clarify the problem first</text>
  <rect x="350" y="210" width="500" height="78" rx="14" class="q"/>
  <text x="600" y="242" text-anchor="middle" class="label">Can deterministic software meet the need?</text>
  <text x="600" y="268" text-anchor="middle" class="small">Prefer the simpler sufficient mechanism.</text>
  <path d="M350 249 H285" class="line"/><text x="310" y="238" class="edge">yes</text>
  <rect x="25" y="210" width="260" height="78" rx="14" class="stop"/>
  <text x="142" y="243" text-anchor="middle" class="label">Use deterministic logic</text><text x="142" y="268" text-anchor="middle" class="small">AI is not required</text>
  <path d="M600 288 V335" class="line"/><text x="615" y="320" class="edge">no</text>
  <rect x="350" y="335" width="500" height="92" rx="14" class="q"/>
  <text x="600" y="367" text-anchor="middle" class="label">Are probable errors and consequences understood?</text>
  <text x="600" y="393" text-anchor="middle" class="small">Include affected people, privacy, cost, and recovery.</text>
  <path d="M850 381 H950" class="line"/><text x="890" y="369" class="edge">no</text>
  <rect x="950" y="335" width="225" height="92" rx="14" class="stop"/>
  <text x="1057" y="370" text-anchor="middle" class="label">Investigate risks</text><text x="1057" y="396" text-anchor="middle" class="small">Do not automate yet</text>
  <path d="M600 427 V475" class="line"/><text x="615" y="459" class="edge">yes</text>
  <rect x="350" y="475" width="500" height="92" rx="14" class="q"/>
  <text x="600" y="507" text-anchor="middle" class="label">Is human authority explicit?</text>
  <text x="600" y="533" text-anchor="middle" class="small">Advice, limited automation, escalation, or direct action.</text>
  <path d="M850 521 H950" class="line"/><text x="890" y="509" class="edge">no</text>
  <rect x="950" y="475" width="225" height="92" rx="14" class="stop"/>
  <text x="1057" y="510" text-anchor="middle" class="label">Define authority</text><text x="1057" y="536" text-anchor="middle" class="small">Add approval and fallback</text>
  <path d="M600 567 V615" class="line"/><text x="615" y="600" class="edge">yes</text>
  <rect x="350" y="615" width="500" height="92" rx="14" class="go"/>
  <text x="600" y="650" text-anchor="middle" class="label">Run a bounded, measurable AI experiment</text>
  <text x="600" y="678" text-anchor="middle" class="small">Define the usefulness threshold before implementation.</text>
</svg>
