<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">From an AI demo to an engineered system</title>
  <desc id="desc">A progression from a model demonstration through defined outcomes, system boundaries, evaluation, operations, and feedback to an engineered AI system.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2}.accent{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.risk{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:3}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.label{font:700 18px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#334155}.note{font:700 16px system-ui,sans-serif;fill:#9a3412}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" class="title">A convincing demo is the beginning, not the product</text>
  <rect x="55" y="120" width="210" height="145" rx="14" class="risk"/>
  <text x="160" y="158" text-anchor="middle" class="label">Model demo</text>
  <text x="160" y="190" text-anchor="middle" class="small">Selected examples</text>
  <text x="160" y="215" text-anchor="middle" class="small">Unclear failure policy</text>
  <text x="160" y="240" text-anchor="middle" class="small">Unknown operating cost</text>
  <path d="M265 192 H345" class="line"/>
  <rect x="345" y="95" width="235" height="195" rx="14" class="accent"/>
  <text x="462" y="135" text-anchor="middle" class="label">Engineering decisions</text>
  <text x="462" y="168" text-anchor="middle" class="small">Outcome and usefulness threshold</text>
  <text x="462" y="195" text-anchor="middle" class="small">System and authority boundaries</text>
  <text x="462" y="222" text-anchor="middle" class="small">Quality, latency, cost, risk</text>
  <text x="462" y="249" text-anchor="middle" class="small">Evaluation and escalation</text>
  <path d="M580 192 H660" class="line"/>
  <rect x="660" y="95" width="235" height="195" rx="14" class="accent"/>
  <text x="777" y="135" text-anchor="middle" class="label">Operational system</text>
  <text x="777" y="168" text-anchor="middle" class="small">Versioned components</text>
  <text x="777" y="195" text-anchor="middle" class="small">Monitoring and feedback</text>
  <text x="777" y="222" text-anchor="middle" class="small">Provider-change strategy</text>
  <text x="777" y="249" text-anchor="middle" class="small">Maintenance ownership</text>
  <path d="M895 192 H975" class="line"/>
  <rect x="975" y="120" width="180" height="145" rx="14" class="ok"/>
  <text x="1065" y="158" text-anchor="middle" class="label">Engineered</text>
  <text x="1065" y="182" text-anchor="middle" class="label">AI system</text>
  <text x="1065" y="218" text-anchor="middle" class="small">Useful, bounded,</text>
  <text x="1065" y="243" text-anchor="middle" class="small">observable, adaptable</text>
  <path d="M1065 265 V400 H780" class="line"/>
  <rect x="420" y="380" width="360" height="130" rx="14" class="box"/>
  <text x="600" y="420" text-anchor="middle" class="label">Evidence from real use</text>
  <text x="600" y="452" text-anchor="middle" class="small">Failures · feedback · changed data</text>
  <text x="600" y="480" text-anchor="middle" class="small">cost · latency · new requirements</text>
  <path d="M420 445 H160 V265" class="line"/>
  <text x="600" y="570" text-anchor="middle" class="note">The system must be revised when evidence invalidates an assumption.</text>
</svg>
