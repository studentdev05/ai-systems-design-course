<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Від демонстрації ШІ до інженерно спроєктованої системи</title>
  <desc id="desc">Перехід від демонстрації моделі через визначені результати, межі системи, оцінювання, експлуатацію та зворотний зв’язок до інженерно спроєктованої системи ШІ.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2}.accent{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.risk{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.ok{fill:#ecfdf5;stroke:#059669;stroke-width:3}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.label{font:700 18px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#334155}.note{font:700 16px system-ui,sans-serif;fill:#9a3412}
    </style>
  </defs>
  <rect width="1200" height="620" fill="#ffffff"/>
  <text x="600" y="50" text-anchor="middle" class="title">Переконлива демонстрація — це початок, а не продукт</text>
  <rect x="55" y="120" width="210" height="145" rx="14" class="risk"/>
  <text x="160" y="158" text-anchor="middle" class="label">Демонстрація моделі</text>
  <text x="160" y="190" text-anchor="middle" class="small">Дібрані приклади</text>
  <text x="160" y="215" text-anchor="middle" class="small">Незрозуміла політика відмов</text>
  <text x="160" y="240" text-anchor="middle" class="small">Невідома експлуатаційна вартість</text>
  <path d="M265 192 H345" class="line"/>
  <rect x="345" y="95" width="235" height="195" rx="14" class="accent"/>
  <text x="462" y="135" text-anchor="middle" class="label">Інженерні рішення</text>
  <text x="462" y="168" text-anchor="middle" class="small">Результат і поріг корисності</text>
  <text x="462" y="195" text-anchor="middle" class="small">Межі системи та повноважень</text>
  <text x="462" y="222" text-anchor="middle" class="small">Якість, затримка, вартість, ризик</text>
  <text x="462" y="249" text-anchor="middle" class="small">Оцінювання та ескалація</text>
  <path d="M580 192 H660" class="line"/>
  <rect x="660" y="95" width="235" height="195" rx="14" class="accent"/>
  <text x="777" y="135" text-anchor="middle" class="label">Система в експлуатації</text>
  <text x="777" y="168" text-anchor="middle" class="small">Компоненти під контролем версій</text>
  <text x="777" y="195" text-anchor="middle" class="small">Моніторинг і зворотний зв’язок</text>
  <text x="777" y="222" text-anchor="middle" class="small">Стратегія змін постачальника</text>
  <text x="777" y="249" text-anchor="middle" class="small">Відповідальність за супровід</text>
  <path d="M895 192 H975" class="line"/>
  <rect x="975" y="120" width="180" height="145" rx="14" class="ok"/>
  <text x="1065" y="158" text-anchor="middle" class="label">Інженерно</text>
  <text x="1065" y="182" text-anchor="middle" class="label">спроєктована</text>
  <text x="1065" y="206" text-anchor="middle" class="label">система ШІ</text>
  <text x="1065" y="232" text-anchor="middle" class="small">Корисна, обмежена,</text>
  <text x="1065" y="254" text-anchor="middle" class="small">спостережувана, адаптивна</text>
  <path d="M1065 265 V400 H780" class="line"/>
  <rect x="420" y="380" width="360" height="130" rx="14" class="box"/>
  <text x="600" y="420" text-anchor="middle" class="label">Свідчення реального використання</text>
  <text x="600" y="452" text-anchor="middle" class="small">Відмови · зворотний зв’язок · змінені дані</text>
  <text x="600" y="480" text-anchor="middle" class="small">вартість · затримка · нові вимоги</text>
  <path d="M420 445 H160 V265" class="line"/>
  <text x="600" y="570" text-anchor="middle" class="note">Систему необхідно переглянути, коли свідчення спростовують припущення.</text>
</svg>
