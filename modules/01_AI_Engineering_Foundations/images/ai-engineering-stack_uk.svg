<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Три шари стека застосунку ШІ</title>
  <desc id="desc">Розроблення застосунку розташоване над розробленням моделі та інфраструктурою. Оцінювання перетинає шари застосунку й моделі, тоді як спостережуваність і врядування перетинають усі шари.</desc>
  <defs><style>.title{font:700 28px system-ui,sans-serif;fill:#0f172a}.layerTitle{font:700 23px system-ui,sans-serif;fill:#0f172a}.item{font:17px system-ui,sans-serif;fill:#1e293b}.cross{font:700 17px system-ui,sans-serif;fill:#ffffff}.boundary{fill:none;stroke:#475569;stroke-width:2;stroke-dasharray:8 7}</style></defs>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Стек застосунку ШІ: обов’язки, а не продукти</text>
  <rect x="165" y="90" width="830" height="170" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
  <text x="205" y="132" class="layerTitle">1. Розроблення застосунку</text>
  <text x="220" y="175" class="item">• взаємодія з користувачем та інтеграція</text>
  <text x="220" y="208" class="item">• інструкції, контекст, інструменти</text>
  <text x="640" y="175" class="item">• оцінювання системи й компонентів</text>
  <text x="640" y="208" class="item">• зворотний зв’язок та ескалація</text>
  <rect x="165" y="285" width="830" height="170" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text x="205" y="327" class="layerTitle">2. Розроблення моделі</text>
  <text x="220" y="370" class="item">• вибір або створення моделі</text>
  <text x="220" y="403" class="item">• адаптація та інженерія набору даних</text>
  <text x="640" y="370" class="item">• оптимізація виведення</text>
  <text x="640" y="403" class="item">• оцінювання на рівні моделі</text>
  <rect x="165" y="480" width="830" height="150" rx="18" fill="#dcfce7" stroke="#059669" stroke-width="3"/>
  <text x="205" y="522" class="layerTitle">3. Інфраструктура</text>
  <text x="220" y="565" class="item">• обслуговування моделі, дані та обчислення</text>
  <text x="640" y="565" class="item">• моніторинг, надійність та експлуатація</text>
  <rect x="1035" y="90" width="105" height="540" rx="18" fill="#334155"/>
  <text x="1088" y="235" text-anchor="middle" transform="rotate(90 1088 235)" class="cross">СПОСТЕРЕЖУВАНІСТЬ</text>
  <text x="1088" y="445" text-anchor="middle" transform="rotate(90 1088 445)" class="cross">ВРЯДУВАННЯ</text>
  <rect x="130" y="72" width="1030" height="580" rx="24" class="boundary"/>
  <text x="600" y="690" text-anchor="middle" class="item">Команди зазвичай починають із шару застосунку й переходять нижче лише тоді, коли цього потребує сценарій використання.</text>
</svg>
